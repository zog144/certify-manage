name: Offline Python tests
on:
  push:
    branches: [main, unstable]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests

  cryptography-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cryptography-version: ["47.0.0", "50.0.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed cryptography compatibility point
        run: python -m pip install -e '.[test]' "cryptography==${{ matrix.cryptography-version }}"
      - name: Run certificate and manager compatibility coverage
        run: python -m pytest -q tests/test_manager.py tests/test_selected_inspection_result.py

  python-315-certbot-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install selected immutable-view runtime versions
        run: python -m pip install -e '.[test]' cryptography==50.0.2 pyOpenSSL==26.4.0 certbot==5.8.0 certbot-dns-cloudflare==5.8.0
      - name: Run certificate and real Certbot compatibility coverage
        run: python -m pytest -q tests/test_manager.py tests/test_selected_inspection_result.py tests/test_certbot_real_cli.py

  certbot-cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed Certbot versions
        run: python -m pip install -e '.[test]' cryptography==50.0.2 certbot==5.8.0 certbot-dns-cloudflare==5.8.0
      - name: Execute real Certbot CLI without network/issuance
        run: python -m pytest -q tests/test_certbot_real_cli.py
