name: Offline Python tests
on:
  push:
    branches: [main, unstable]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests

  certbot-cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed Certbot versions
        run: python -m pip install -e '.[test]' certbot==5.8.0 certbot-dns-cloudflare==5.8.0
      - name: Execute real Certbot CLI without network/issuance
        run: python -m pytest -q tests/test_certbot_real_cli.py
